<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>주문 안 하신 쓰레기 나왔습니다</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/sunghyunzz/eulyoo1945/eulyoo1945.css"/>
	<style>
@font-face {
  font-family: 'HSBombaram';
  src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/HSBombaram.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}


#loadingOverlay {
  position: fixed;
  inset: 0;                 /* top:0; right:0; bottom:0; left:0 동일 */
  background: black;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.6s ease;
}

#loadingIcon {
  width: 150px;
  animation: spin 1s linear infinite;
}

.loadingText {
  margin-top: 150px;
  font-size: 20px;
  color: yellow;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

body {
  text-align: center;
  font-family: eulyoo1945;
  margin: 0;
  overflow: hidden;
  cursor: url('cursor.png') 40 40, auto;
  background: dimgray;
  background-size: cover;
}

div { position: relative; margin: 0; }

img { position: absolute; }

h1 {
  font-family: "HsBombaram";
  font-weight: normal;
  font-size: 170px;
  padding: 10px;
  margin: 0;
  transition: opacity 0.6s ease;
}

p {
  font-family: 'eulyoo1945';
  font-weight: 400;
  font-size: 17px;
  line-height: 1.7;
}
.wrap {
	opacity: 0;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 800px;
  background: white;
  transition: opacity 0.6s ease;
  z-index: 2500;
  padding: 50px 30px;
  pointer-events: auto;
}


#hint {
  margin: auto;
  width: 100px;
  height: 40px;
  font-size: 12px;
  font-weight: 700;
  color: darkslateblue;
  padding-top: 10px;
}
#hint:hover {
  color: lavender;
}


.fade-out {
  opacity: 0 !important;
}

#mainscreen {
  opacity: 0;
  transition: opacity 0.8s ease;
  position: absolute;
  inset: 0; /* 화면 전체 사용 */
}

.fade-in {
  opacity: 1 !important;
}

.trash:hover{
	filter: drop-shadow(0px 0px 10px white)
}
.trash2:hover{
	filter: drop-shadow(0px 0px 10px black)
}

#circleWrap {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: auto; /* 빈 자리 클릭 받기 */
  z-index: 100;
  height: 600px;
}

.circle {
  position: absolute;
  border-radius: 50%;
  background-color: rgba(255, 255, 255, 0.25);
  filter: blur(12px);
  transition: opacity 0.6s ease; /* 위치/transform은 JS에서 처리 */
  will-change: transform, left, top, opacity;
  backface-visibility: hidden;
}

.floating-text {
  position: absolute;
  font-size: 20px;
  color: white;
  animation: fadeUp 1.5s ease forwards;
}

@keyframes fadeUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-20px); }
}

@keyframes floatMove {
  0% { transform: translate(0px, 0px); }
  50% { transform: translate(20px, -25px); }
  100% { transform: translate(0px, 0px); }
}

.particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

.particle.img {
  filter: none;
  border-radius: 0;
}

.float-img {
  position: absolute;
  width: 80px;     /* 반드시 크기 명시 */
  height: 80px;
  object-fit: contain;
  pointer-events: none;
  z-index: 5;      /* 원보다 위 */
  transition: transform 0.25s ease-out;
}

button{cursor: url('cursor.png') 40 40, auto;}

.next {
	position: absolute;
	top: 85%;
	left: 87%;
	transform: translate(-50%, -50%);
	font-family: eulyoo1945;
    margin-top: 30px;
    padding: 12px 30px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    background-color: #fff;
    color: #000;
    pointer-events: auto;
    transition: background-color 0.3s, color 0.3s;
    z-index: 10000;
}

	.next:hover {
    background-color: #000;
    color: #fff;
}

</style>

</head>
<body>
<div id="loadingOverlay">
  <img src="bgtrash.png" id="loadingIcon">
  <div class="loadingText">Loading...</div>
</div>

<div>
  <img src="table.png" style="width: 100vw; z-index: 600; top: 40vw; left: 0px;">     
<img src="dish.png" style="width: 800px; z-index: 900; top: 31vw; left: 50%; transform: translateX(-50%);">
</div>
  <div id="wrapBox" class="wrap">
  	<p style="font-weight: 600; padding-bottom: 10px;">애피타이저</p>
    <p>
      피조물의 탄생에는 늘 고뇌와 밤샘이 함께하죠.<br>본격적인 작업을 시작하기도 전에 아이디어가 떠오르지 않아 안개가 낀 것처럼 갑갑한 마음,<br>다들 한번쯤 경험해 보신 적 있지 않나요?<br>답답한 마음을 달래고자 피운 담배꽁초에<br>잠을 쫓기 위해 커피를 마시고 남은 플라스틱 잔을 곁들이면<br>그 마음을 표현하기에는 부족함이 없습니다.
    </p>
    <div id="hint" class="hint">계속 ▸</div>
  </div>
  <div id="mainscreen" style="z-index: 950;">
  	<img src="cig 1.png" style="width: 150px; top: 79vh;
  left: 42vw; transform: translate(-50%, -50%); z-index: 1002;" class="trash2" id="cig">
  	<img src="cig 2.png" style="width: 200px; top: 79vh;
  left: 56vw; transform: translate(-50%, -50%); z-index: 1001;" class="trash2" id="cig">
  	<img src="cup1.png" style="width: 230px; top: 62vh;
  left: 44vw; transform: translate(-50%, -50%); z-index: 999;" class="trash" id="cup">
  	<img src="cup2.png" style="width: 180px; top: 64vh;
  left: 54vw; transform: translate(-50%, -50%); z-index: 1000;" class="trash" id="cup">
<div id="circleWrap" style="position:fixed; inset:0; z-index: -1; pointer-events:auto;"></div>

  	 <button id="next" class="next">다음으로</button>

  </div>
<script>
/* ──────────────────────────
   기본 요소 가져오기
────────────────────────── */
const hint = document.getElementById('hint');
const wrapBox = document.getElementById('wrapBox');
const mainScreen = document.getElementById('mainscreen');
const overlay = document.getElementById('loadingOverlay');

const cupElements = document.querySelectorAll(".trash");
const cigElements = document.querySelectorAll(".trash2");
const nextBtn = document.getElementById('next');

const circleWrap = document.getElementById("circleWrap");

/* 사용될 이미지 목록 */
const imgList = [
  "sleepy1.png",
  "sleepy2.png",
  "sleepy3.png"
];

/* 이미지가 섞여 나오는 비율 (0.2 = 20% 확률로 이미지 생성) */
let imageSpawnRate = 0.25;

/* 이미지의 z-index 기본 값 (원보다 위/아래로 조정 가능) */
let imageBaseZ = 40;

/* 원은 z-index 1~30, 이미지 z-index는 imageBaseZ ~ imageBaseZ+30 */
if (!circleWrap) {
  console.error("circleWrap 요소가 없습니다. HTML에 <div id='circleWrap'> 추가하세요.");
}

/* ──────────────────────────
   로딩 처리
────────────────────────── */
window.addEventListener("load", () => {
  const MIN = 1000;
  setTimeout(() => {
    overlay.style.opacity = "0";
    wrapBox.classList.add('fade-in');
    setTimeout(() => overlay.style.display = "none", 650);
  }, MIN);
});

/* hint 클릭 → wrap 사라지고 mainscreen 등장 */
hint.addEventListener("click", () => {
  wrapBox.classList.remove("fade-in");
  wrapBox.classList.add("fade-out");
  setTimeout(() => {
    wrapBox.style.display = "none";
    mainScreen.classList.add("fade-in");
  }, 650);
});


/* ──────────────────────────
   🔥 원 + 이미지 객체 통합 관리
────────────────────────── */
let objects = [];  // 원 + 이미지 모두 포함
let defaultCircleCount = 80;

/* 🎨 색상 팔레트 */
const colorPalette = ["lightslategray", "darkslategray", "slategray", "black"];
let currentColorIndex = 0;
let circleColor = colorPalette[currentColorIndex];

/* 말풍선 랜덤 문구 */
const texts = [
  "음... 아니야.",
  "다시 생각해보자.",
  "흠…",
  "이건 아닌데.",
  "음, 글쎄."
];

/* 유틸 */
const rand = (min, max) => Math.random() * (max - min) + min;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];


/* ──────────────────────────
   🔥 원/이미지 생성 함수
────────────────────────── */
function createFloatingObject() {
  const isImage = Math.random() < imageSpawnRate;
  const size = rand(40, 110);

  const x = rand(0, circleWrap.clientWidth - size);
  const y = rand(0, circleWrap.clientHeight - size);

  let el;

  if (isImage) {
    el = document.createElement("img");
    el.className = "float-img";
    el.src = pick(imgList);

    el.style.width = size + "px";
    el.style.height = "auto";

    /* 이미지 z-index 레이어 */
    el.style.zIndex = imageBaseZ + Math.floor(rand(0, 30));

  } else {
    el = document.createElement("div");
    el.className = "circle";
    el.style.backgroundColor = circleColor;
    el.style.width = size + "px";
    el.style.height = size + "px";

    /* 원은 낮은 레이어 */
    el.style.zIndex = Math.floor(rand(1, 30));
  }

  el.style.position = "absolute";
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.opacity = "0";
  el.style.transition = "opacity 800ms ease";
  el.style.pointerEvents = "none";

  circleWrap.appendChild(el);

  objects.push({
    type: isImage ? "img" : "circle",
    el,
    size,
    baseX: x,
    baseY: y,
    x,
    y,
    vx: rand(-0.03, 0.03),
    vy: rand(-0.03, 0.03),
    freq: rand(0.0006, 0.0016),
    amp: rand(4, 14),
    phase: rand(0, Math.PI * 2),
    offsetX: 0,
    offsetY: 0
  });

  requestAnimationFrame(() => {
    el.style.opacity = "1";
  });
}


/* ──────────────────────────
   🔥 초기 원/이미지 구성
────────────────────────── */
function initObjects() {
  for (let i = 0; i < defaultCircleCount; i++) {
    createFloatingObject();
  }
}
initObjects();


/* ──────────────────────────
   🔥 애니메이션 루프
────────────────────────── */
let lastTime = performance.now();

function animate(time) {
  const dt = Math.min(time - lastTime, 40);
  lastTime = time;

  const W = circleWrap.clientWidth;
  const H = circleWrap.clientHeight;

  objects.forEach((o) => {

    o.baseX += o.vx * dt;
    o.baseY += o.vy * dt;

    if (o.baseX < 0) { o.baseX = 0; o.vx *= -1; }
    if (o.baseY < 0) { o.baseY = 0; o.vy *= -1; }
    if (o.baseX > W - o.size) { o.baseX = W - o.size; o.vx *= -1; }
    if (o.baseY > H - o.size) { o.baseY = H - o.size; o.vy *= -1; }

    const wobX = Math.sin(time * o.freq + o.phase) * o.amp;
    const wobY = Math.cos(time * o.freq + o.phase * 0.7) * (o.amp / 2);

    o.x = o.baseX + wobX;
    o.y = o.baseY + wobY;

    o.offsetX *= 0.9;
    o.offsetY *= 0.9;

    o.el.style.left = o.x + "px";
    o.el.style.top = o.y + "px";
    o.el.style.transform = `translate(${o.offsetX}px, ${o.offsetY}px)`;
  });

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);


/* ──────────────────────────
   🔥 마우스 회피
────────────────────────── */
document.addEventListener("mousemove", (e) => {
  const mx = e.clientX;
  const my = e.clientY;
  const fleeRadius = 280;
  const pushMax = 180;

  objects.forEach((o) => {
    const cx = o.x + o.size / 2;
    const cy = o.y + o.size / 2;
    const dx = cx - mx;
    const dy = cy - my;
    const dist = Math.hypot(dx, dy);

    if (dist < fleeRadius) {
      const ang = Math.atan2(dy, dx);
      const push = (1 - dist / fleeRadius) * pushMax;

      o.offsetX = o.offsetX * 0.7 + Math.cos(ang) * push * 0.3;
      o.offsetY = o.offsetY * 0.7 + Math.sin(ang) * push * 0.3;
    }
  });
});


/* ──────────────────────────
   🔥 빈 공간 클릭 → 텍스트 표시
────────────────────────── */
circleWrap.addEventListener("click", (e) => {
  const t = document.createElement("div");
  t.className = "floating-text";
  t.innerText = pick(texts);
  t.style.position = "fixed";
  t.style.left = e.clientX + "px";
  t.style.top = e.clientY + "px";
  t.style.zIndex = 99999;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1500);
});


/* ──────────────────────────
   🔥 cup 클릭 → 원 색 변경
────────────────────────── */
cupElements.forEach((el) => {
  el.addEventListener("click", (e) => {
    currentColorIndex = (currentColorIndex + 1) % colorPalette.length;
    circleColor = colorPalette[currentColorIndex];

    objects.forEach((o) => {
      if (o.type === "circle") {
        o.el.style.backgroundColor = circleColor;
      }
    });

    e.stopPropagation();
  });
});


/* ──────────────────────────
   🔥 cig 클릭 → 새 객체 생성 (비율 동일)
────────────────────────── */
cigElements.forEach((el) => {
  el.addEventListener("click", (e) => {
    for (let i = 0; i < 20; i++) {
      createFloatingObject();
    }
    e.stopPropagation();
  });
});


/* ───────── next 버튼 ───────── */
nextBtn.addEventListener("click", () => {
  window.location.href = "index3.html";
});
</script>




</body>
</html>
