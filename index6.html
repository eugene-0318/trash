<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문 안 하신 쓰레기 나왔습니다</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/sunghyunzz/eulyoo1945/eulyoo1945.css"/>
  <style>
@font-face {
  font-family: 'HSBombaram';
  src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/HSBombaram.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}

#loadingOverlay {
  position: fixed;
  inset: 0;  
  background: black;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.6s ease;
}

#loadingIcon {
  width: 150px;
  animation: spin 1s linear infinite;
}

.loadingText {
  margin-top: 150px;
  font-size: 20px;
  color: yellow;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

body {
  text-align: center;
  font-family: eulyoo1945;
  margin: 0;
  overflow: hidden;
  cursor: url('cursor.png') 40 40, auto;
  background: black;
  background-size: cover;
}

div { position: relative; margin: 0; }

img { position: absolute; }

h1 {
  font-family: "HsBombaram";
  font-weight: normal;
  font-size: 170px;
  padding: 10px;
  margin: 0;
  transition: opacity 0.6s ease;
}

p {
  font-family: 'eulyoo1945';
  font-weight: 400;
  font-size: 17px;
  line-height: 1.7;
}

.wrap {
  opacity: 0;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 800px;
  background: white;
  transition: opacity 0.6s ease;
  z-index: 2500;
  padding: 50px 30px;
  pointer-events: auto;
}

.wrap.show {
  display: block;
  opacity: 1;
  pointer-events: auto;
}

.hint { margin: auto;
    width: 100px;
    height: 40px;
    font-size: 12px;
    font-weight: 700;
    color: dimgray;
    padding-top: 10px;
    }

.hint:hover{
  color: gainsboro;
}

.fade-out {
  opacity: 0 !important;
}

#mainscreen {
  opacity: 0;
  transition: opacity 0.8s ease;
  position: absolute;
  inset: 0;
}

.fade-in {
  opacity: 1 !important;
}

.text-ring {
  position: absolute;
  animation-name: spin;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  top: 50%;
  left: 50%;
  transform-origin: center;
  pointer-events: none;
    font-family: "HsBombaram";
}

.char {
  position: absolute;
  left: 50%;
  top: 50%;
  transform-origin: 0 0;
  white-space: pre;
  color: #ffffffcb;
  font-weight: 400;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}


button{cursor: url('cursor.png') 40 40, auto;}

.next {
  position: absolute;
  top: 85%;
  left: 87%;
  transform: translate(-50%, -50%);
  font-family: eulyoo1945;
    margin-top: 30px;
    padding: 12px 30px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    background-color: white;
    color: black;
    pointer-events: auto;
    transition: background-color 0.3s, color 0.3s;
    z-index: 10000;
}

  .next:hover {
    background-color: dimgray;
    color: gainsboro;
}

</style>

</head>
<body>
<div id="loadingOverlay">
  <img src="bgtrash.png" id="loadingIcon">
  <div class="loadingText">요리 중...</div>
</div>
<div>
  <img src="table.png" style="width: 100vw; z-index: 600; top: 40vw; left: 0px;">     
<img src="dish.png" style="width: 800px; z-index: 900; top: 31vw; left: 50%; transform: translateX(-50%);">
</div>
  <div id="wrapBox" class="wrap">
    <p style="font-weight: 600; padding-bottom: 10px;font-size: 19px;">식후 커피</p>
    <p>
이렇게 프로젝트 하나가 끝났습니다.<br>후련하긴 한데…이 기분은 뭐죠?<br>마냥 기쁘지는 않은 허전함, 허무함이 감돕니다.<br>눈앞에는 공들여 만들었고 괜찮은 평가를 받은 과제물이 있지만, 그뿐입니다.<br>우리는 조금 전까지 뭘 해왔던 걸까요?

    </p>
    <div id="hint" class="hint">계속 ▸</div>
  </div>
  <div id="mainscreen" style="z-index: 2000;">
<img id="coff" src="coff.png" style="transform: translateX(-50%); top: 59vh; left: 50%;width:330px;">

<div id="circle-wrap"></div>
  <button id="next" class="next">다음으로</button>
  </div>
<script>
let clickCount = 0;

const hint = document.getElementById('hint');
const wrapBox = document.getElementById('wrapBox');
const mainScreen = document.getElementById('mainscreen');
const overlay = document.getElementById('loadingOverlay');
const coff = document.getElementById('coff');
const wrap = document.getElementById('circle-wrap');

/* 로딩 오버레이 처리 */
window.addEventListener("load", () => {
  const MIN = 1000;
  setTimeout(() => {
    overlay.style.opacity = "0";
    wrapBox.classList.add('fade-in');

    setTimeout(() => {
      overlay.style.display = "none";
    }, 650);
  }, MIN);
});


/* 🔥 coff 클릭 → 원형 텍스트 생성 + 랜덤 배치 + 회전 속도 변화 */
coff.addEventListener('click', () => {
  clickCount++;

  // ✨ 여러 문구를 배열로 저장
  const texts = [
    '우리는 조금 전까지 뭘 해왔던 걸까요?',
    '끝났다...진짜 끝났나?',
    '이제 뭘 하면 되지?',
    '조금 허무하네.',
    '이렇게 끝난다고?',
    '후련한가? 기쁜가?'
  ];

  // ✨ 배열 중 랜덤 1개 선택
  const baseText = texts[Math.floor(Math.random() * texts.length)];

  const chars = baseText.split("");

  // 🔥 원형 텍스트 그룹 생성
  const ring = document.createElement('div');
  ring.classList.add('text-ring');

  // 🔥 1) 회전 속도 (짧을수록 빠름)
  const duration = Math.max(20 - clickCount * 1.2, 3);
  ring.style.animationDuration = duration + 's';

  // 🔥 2) 랜덤 크기(반지름)
  const radius = Math.floor(Math.random() * 120) + 90; // 90~210px
  ring.style.width = radius * 2 + 'px';
  ring.style.height = radius * 2 + 'px';

  // 🔥 3) 랜덤 위치
  const maxX = window.innerWidth - radius * 2;
  const maxY = window.innerHeight - radius * 2;
  const posX = Math.random() * maxX;
  const posY = Math.random() * maxY;

  ring.style.left = posX + 'px';
  ring.style.top = posY + 'px';

  // 🔥 4) 랜덤 폰트 크기
  const fontSize = Math.floor(Math.random() * 30) + 18; // 18~48px

  // 🔥 5) 원형 텍스트 배치
  const totalChars = chars.length;
  const angleStep = 360 / totalChars;

  chars.forEach((char, i) => {
    const span = document.createElement('span');
    span.innerText = char;
    span.classList.add('char');
    span.style.fontSize = fontSize + 'px';

    const angle = i * angleStep;
    span.style.transform =
      `rotate(${angle}deg) translate(${radius}px) rotate(90deg)`;

    ring.appendChild(span);
  });

  wrap.appendChild(ring);
});


/* hint 클릭 → wrap 사라지고 mainscreen 나타남 */
hint.addEventListener("click", () => {
  wrapBox.classList.remove("fade-in");
  wrapBox.classList.add("fade-out");

  setTimeout(() => {
    wrapBox.style.display = "none";
    mainScreen.classList.add("fade-in");
  }, 650);
});


/* 다음 페이지 버튼 */
next.addEventListener("click", () => {
  window.location.href = "index7.html";
});
</script>

</body>
</html>
